global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: user-order-service
    static_configs:
      - targets: ["user-order-service:8000"]
  - job_name: engine-service
    static_configs:
      - targets: ["engine-service:8001"]
  - job_name: projection-service
    static_configs:
      - targets: ["projection-service:8002"]
