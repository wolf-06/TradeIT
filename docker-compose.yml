# `version:` is obsolete in Compose v2+ (it is ignored and only emits a warning), so it is omitted.
services:
  db:
    container_name: tradeit_db
    # Pinned: "postgres" (latest) now resolves to 18.x, which changed the data
    # directory layout (PGDATA=/var/lib/postgresql/18/docker). Never use a floating
    # tag for a database image, or a fresh image pull can break an existing volume.
    image: postgres:18-alpine
    # No "user:" override on purpose: the entrypoint must start as root so it can
    # chown/chmod PGDATA and /var/run/postgresql, then it drops to the postgres user.
    # Forcing `user: 1000:1000` caused:
    #   chmod: changing permissions of '/var/run/postgresql': Operation not permitted
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dev123
      - POSTGRES_DB=tradeit
    volumes:
      # Postgres 18+ requires the mount at /var/lib/postgresql (the parent), NOT
      # /var/lib/postgresql/data. Mounting at .../data makes the entrypoint abort with
      #   "there appears to be PostgreSQL data in: /var/lib/postgresql/data (unused mount/volume)"
      # even when the volume is completely empty.
      - postgres_data:/var/lib/postgresql

  redis:
    container_name: tradeit_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

