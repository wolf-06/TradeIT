# TradeIT demo stack.
#
#   docker compose up -d --build                       # db + redis + the three services
#   docker compose --profile observability up -d       # + Prometheus and Grafana
#   docker compose --profile bench run --rm loadgen    # drive load and verify read-back
#
# All three services share the ingest volume (ipc_data) where the per-symbol rings and
# WALs live, and mount config/ read-only for the shared symbol table and ingest knobs.
# The db/redis host ports are overridable (TRADEIT_DB_PORT / TRADEIT_REDIS_PORT) so the
# stack can run next to an existing Postgres or Redis; the services always reach them as
# db:5432 and redis:6379 on the compose network regardless.

name: tradeit

# Environment shared by the three application services.
x-app-env: &app-env
  TRADEIT_CONFIG: /app/config/tradeit.toml
  redis_addr: redis:6379
  redis_password: ""
  db_host: db
  db_port: "5432"
  db_user: postgres
  db_passwd: dev123
  db_name: tradeit

services:
  db:
    container_name: tradeit_db
    # Pinned: a floating tag can change the data-directory layout under an existing
    # volume. Postgres 18+ mounts at /var/lib/postgresql (the parent), not .../data.
    image: postgres:18-alpine
    ports:
      - "${TRADEIT_DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dev123
      - POSTGRES_DB=tradeit
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradeit"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    container_name: tradeit_redis
    image: redis:7-alpine
    ports:
      - "${TRADEIT_REDIS_PORT:-6379}:6379"
    # Order-status cache entries are short-lived; evict them under memory pressure.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  user-order-service:
    container_name: tradeit_user_order_service
    build:
      context: .
      dockerfile: services/user-order-service/Dockerfile
    image: tradeit/user-order-service:local
    ports:
      - "${TRADEIT_USER_ORDER_PORT:-8000}:8000"
    environment:
      <<: *app-env
      jwtkey: ${JWTKEY:-dev-secret-change-me}
    volumes:
      - ipc_data:/app/ipc
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

  engine-service:
    container_name: tradeit_engine_service
    build:
      context: .
      dockerfile: services/engine-service/Dockerfile
    image: tradeit/engine-service:local
    ports:
      - "${TRADEIT_ENGINE_PORT:-8001}:8001"
    environment: *app-env
    volumes:
      - ipc_data:/app/ipc
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      # The engine opens the rings the producer creates, so it starts after it.
      user-order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/healthz >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

  projection-service:
    container_name: tradeit_projection_service
    build:
      context: .
      dockerfile: services/projection-service/Dockerfile
    image: tradeit/projection-service:local
    ports:
      - "${TRADEIT_PROJECTION_PORT:-8002}:8002"
    environment: *app-env
    volumes:
      - ipc_data:/app/ipc
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The projector tails the consumer WAL the engine creates.
      engine-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/healthz >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

  # Load generator for end-to-end benchmarking and read-back verification.
  #   docker compose --profile bench run --rm loadgen
  # Override the workload with e.g. `... run --rm loadgen -n 100000 -c 128`.
  loadgen:
    profiles: ["bench"]
    container_name: tradeit_loadgen
    build:
      context: .
      dockerfile: services/loadgen/Dockerfile
    image: tradeit/loadgen:local
    command: ["-base", "http://user-order-service:8000", "-n", "20000", "-c", "64", "-verify", "200"]
    depends_on:
      user-order-service:
        condition: service_healthy

  # Observability stack:  docker compose --profile observability up -d
  prometheus:
    profiles: ["observability"]
    container_name: tradeit_prometheus
    image: prom/prometheus:v2.54.1
    ports:
      - "${TRADEIT_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - user-order-service
      - engine-service
      - projection-service

  grafana:
    profiles: ["observability"]
    container_name: tradeit_grafana
    image: grafana/grafana:11.2.0
    ports:
      - "${TRADEIT_GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  # Shared-memory ingest files (rings, WALs, snapshots, control regions). For maximum
  # throughput, replace this named volume with a RAM-backed bind mount on all three
  # services, e.g. `- /dev/shm/tradeit:/app/ipc` (the ring is mmap'd, so a tmpfs keeps it
  # at memory speed).
  ipc_data:
  prometheus_data:
  grafana_data:
